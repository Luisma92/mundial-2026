server {
    listen 80;
    server_name mundial.nuc;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name mundial.nuc;

    ssl_certificate /etc/nginx/ssl/mundial.nuc.pem;
    ssl_certificate_key /etc/nginx/ssl/mundial.nuc-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/mundial-2026;
    index index.html;

    # Static assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — all non-asset, non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
